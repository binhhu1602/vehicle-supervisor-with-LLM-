[project]
name = "trafficeye-backend"
version = "0.2.0"
description = "Backend hệ thống giám sát giao thông thời gian thực tích hợp LLM (FastAPI + PostgreSQL)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: cần PostgreSQL (tự bỏ qua nếu không kết nối được)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"
